Name: Soul Track
Summary: Offline-first life tracking with timer, pomodoro, todos, and growth insights
Description: |
  Soul Track is a privacy-first life tracking application that runs entirely
  on your device. No internet permission, no accounts, no data leaves your phone.

  Core features include time tracking with category-based sessions, a pomodoro
  timer with customizable work and break durations, a todo list with priorities,
  deadlines, and subtasks, and a growth score system that calculates progress
  across learning, productivity, exercise, sleep, social interaction, novelty,
  and consistency.

  Additional features include insights with charts and trend analysis, home
  screen widgets for quick access, optional local device sync via Syncthing,
  and a dark theme with customizable colors.

  All data is stored locally using SQLite. The optional sync feature uses
  Syncthing for encrypted local network transfer between your own devices.
  No cloud services, no analytics, no tracking.

